# Deployment for Coolify (Docker Compose build pack) or plain `docker compose up`.
# Coolify: set VIDIS_API_KEYS in the environment and assign the domain to the
# vidis-checker service, port 8645. Traefik terminates TLS.
services:
  vidis-checker:
    build: .
    restart: unless-stopped
    environment:
      # Comma-separated; every key gets full API access. Required.
      VIDIS_API_KEYS: ${VIDIS_API_KEYS:?set VIDIS_API_KEYS}
      # Keys that see every job (operators); other keys see only their own jobs.
      VIDIS_ADMIN_KEYS: ${VIDIS_ADMIN_KEYS:-}
      VIDIS_JOB_WORKERS: ${VIDIS_JOB_WORKERS:-2}
      # Public base URL for links in job callbacks, e.g. https://vidis-checker.example
      VIDIS_PUBLIC_URL: ${VIDIS_PUBLIC_URL:-}
      # Default Landesportal for agentic runs. Login credentials are never taken
      # from the environment for API jobs; each job brings its own.
      VIDIS_AGENT_VIDIS_PORTAL: ${VIDIS_AGENT_VIDIS_PORTAL:-}
      # Optional: Gemini on Vertex AI for screenshot reviews. Without a key the
      # checks stay fully deterministic.
      GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      VIDIS_LLM_MODEL_FAST: ${VIDIS_LLM_MODEL_FAST:-}
      VIDIS_LLM_MODEL_STRONG: ${VIDIS_LLM_MODEL_STRONG:-}
      VIDIS_LLM_DISABLED: ${VIDIS_LLM_DISABLED:-}
    expose:
      - "8645"
    volumes:
      - vidis-results:/data/results
      - vidis-inputs:/data/inputs
    # Chromium needs more than Docker's 64 MB default /dev/shm.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8645/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  vidis-results:
  vidis-inputs:
