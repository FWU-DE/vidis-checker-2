<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">VIDIS Compliance CLI run</title>
  <desc id="desc">Illustrative screenshot of running the VIDIS compliance CLI and receiving report output paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="72" y="88" fill="#e5f3ff" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="700">VIDIS Compliance CLI</text>
  <text x="74" y="128" fill="#9fb6cc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Website prüfen, Evidence erfassen, Reports erzeugen</text>
  <g transform="translate(72 170)" filter="url(#shadow)">
    <rect width="1136" height="500" rx="18" fill="#07111f" stroke="#1f3854"/>
    <rect width="1136" height="52" rx="18" fill="#0d1b2d"/>
    <circle cx="28" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="26" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="26" r="7" fill="#28c840"/>
    <text x="102" y="33" fill="#8aa6c1" font-family="SFMono-Regular, Menlo, monospace" font-size="15">terminal</text>
    <g font-family="SFMono-Regular, Menlo, monospace" font-size="22">
      <text x="34" y="100" fill="#6ee7b7">$</text>
      <text x="64" y="100" fill="#dbeafe">uv run vidis check --url https://anbieter.example --pages 8 --md results/demo/report.md --pdf results/demo/report.pdf</text>
      <text x="34" y="150" fill="#93c5fd">[crawl]</text>
      <text x="140" y="150" fill="#cbd5e1">captured pages, cookies, storage, requests and scripts</text>
      <text x="34" y="198" fill="#93c5fd">[checks]</text>
      <text x="140" y="198" fill="#cbd5e1">mapped evidence to VIDIS criteria</text>
      <text x="34" y="246" fill="#93c5fd">[report]</text>
      <text x="140" y="246" fill="#cbd5e1">wrote Markdown and PDF reports</text>
      <text x="34" y="318" fill="#22c55e">PASS</text>
      <text x="112" y="318" fill="#e2e8f0">ITS-ENC-359 Website nur über https:// aufrufbar</text>
      <text x="34" y="366" fill="#ef4444">FAIL</text>
      <text x="112" y="366" fill="#e2e8f0">RDS-CUC-371 Nicht essenzielle Cookies</text>
      <text x="34" y="414" fill="#f59e0b">MANUELL</text>
      <text x="156" y="414" fill="#e2e8f0">RDS-SPE-370 Sponsoring benötigt Review</text>
      <text x="34" y="466" fill="#94a3b8">Artifacts: results/demo/result.json · capture.json · report.md · report.pdf</text>
    </g>
  </g>
</svg>
