[project]
name = "vidis-compliance"
version = "0.1.0"
description = "Unified VIDIS compliance checker: code inspection + browser site evaluation"
authors = [{ name = "FWU", email = "it@fwu.de" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer[all]>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "reportlab>=4.1",
  "httpx>=0.27",
  "playwright>=1.45",
  "beautifulsoup4>=4.12",
]

[project.scripts]
vidis = "vidis_compliance.cli:app"
vidis-report = "vidis_compliance.report_cli:app"

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "black>=24.4",
]
package = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
vidis_compliance = ["report/templates/*.j2", "checks/site/cookie_db.json", "checks/site/COOKIE_DB_SOURCE.md"]

[tool.setuptools.packages.find]
where = ["src"]
