[project]
name = "vidis-compliance"
version = "1.0.0"
description = "Unified VIDIS compliance checker: code inspection + browser site evaluation"
authors = [{ name = "FWU", email = "it@fwu.de" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.14",
  "PyYAML>=6.0.3",
  "typer>=0.29",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "jinja2>=3.1.6",
  "reportlab>=5.1",
  "httpx>=0.28.1",
  "playwright>=1.65",
  "beautifulsoup4>=4.15",
  "google-auth>=2.40",
  "requests>=2.32",
]

[project.scripts]
vidis = "vidis_compliance.cli:app"
vidis-report = "vidis_compliance.report_cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "mypy>=2.4",
  "black>=26.10",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
vidis_compliance = ["report/templates/*.j2", "checks/site/cookie_db.json", "checks/site/COOKIE_DB_SOURCE.md"]

[tool.setuptools.packages.find]
where = ["src"]
